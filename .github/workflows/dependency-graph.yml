name: Dependency Graph

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # GitHub's dependency submission API requires contents: write.
      contents: write
    env:
      JAVA_OPTS: -Xms2G -Xmx2G -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7 # v1

      - name: Submit sbt dependency graph
        uses: scalacenter/sbt-dependency-submission@d84eef4c09e633bcf5f113bcad7fd5e9af1baee9 # v3.2.3
