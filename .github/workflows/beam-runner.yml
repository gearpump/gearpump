name: Beam Runner

on:
  pull_request:
    paths:
      - ".github/workflows/beam-runner.yml"
      - "build.sbt"
      - "scalastyle-config.xml"
      - "checkstyle-config.xml"
      - "project/**"
      - "experiments/beam/**"
      - "core/**"
      - "streaming/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/beam-runner.yml"
      - "build.sbt"
      - "scalastyle-config.xml"
      - "checkstyle-config.xml"
      - "project/**"
      - "experiments/beam/**"
      - "core/**"
      - "streaming/**"
  workflow_dispatch:

jobs:
  beam-runner-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Check Beam runner Java and Scala style
        run: >-
          sbt -Dsbt.log.noformat=true
          gearpump-beam-runner/scalastyle
          gearpump-beam-runner/Test/scalastyle
          gearpump-beam-runner/checkstyle
          gearpump-beam-runner/Test/checkstyle

      - name: Run Beam runner tests
        run: sbt -Dsbt.log.noformat=true gearpump-beam-runner/test
