name: CI

on:
  pull_request:
  push:
    branches:
      - master
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      JAVA_OPTS: -Xms2G -Xmx2G -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up Temurin JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Build
        run: sbt -Dsbt.log.noformat=true clean compile test:compile

      - name: Check JVM startup and serialization compatibility
        run: >-
          sbt -Dsbt.log.noformat=true
          'gearpump-core/testOnly io.gearpump.util.JvmConfigSpec io.gearpump.serializer.SerializerSpec io.gearpump.util.ActorSystemBooterSpec io.gearpump.cluster.master.AppMasterLauncherSpec io.gearpump.cluster.appmaster.ExecutorSystemLauncherSpec'
          gearpump-streaming/test
